# Builds Note Pocket for Android, Windows and Linux for every pushed vX.Y.Z tag and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches pubspec.yaml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version: *\([0-9.]*\)+[0-9]*.*/\1/p' pubspec.yaml)
          code=$(sed -n 's/^version: *[0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml)
          if [ "$version" != "$declared" ]; then echo "Tag $GITHUB_REF_NAME does not match version $declared in pubspec.yaml"; exit 1; fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -s "$changelog" ]; then echo "Missing $changelog"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Run tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secrets are missing. See README > Releasing."; exit 1; fi
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing/keystore.properties

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "NotePocket-${{ needs.check.outputs.version }}-android.apk"

      - name: Remove signing key
        if: always()
        run: rm -f signing/release.jks signing/keystore.properties

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: NotePocket-*-android.apk

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build Windows app
        shell: pwsh
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "NotePocket-${{ needs.check.outputs.version }}-windows.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: NotePocket-*-windows.zip

  linux:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Build Linux app
        run: |
          flutter build linux --release
          cp -r build/linux/x64/release/bundle NotePocket
          tar -czf "NotePocket-${{ needs.check.outputs.version }}-linux-x64.tar.gz" NotePocket

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: NotePocket-*-linux-x64.tar.gz

  publish:
    needs: [check, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          CHANGELOG: ${{ needs.check.outputs.changelog }}
        run: |
          prerelease=""
          if [ "${VERSION%%.*}" = "0" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* --title "Note Pocket $GITHUB_REF_NAME" --notes-file "$CHANGELOG" $prerelease
