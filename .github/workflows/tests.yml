# Runs the analyzer and tests for every push to main and every pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable

      - name: Run tests
        run: |
          flutter pub get
          flutter analyze
          flutter test
